services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Switch the store + checkpoints to Postgres when set.
      # Leave unset to use the JSON file store + SQLite checkpoints.
      DATABASE_URL: postgres://workflow:workflow@postgres:5432/workflow
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
