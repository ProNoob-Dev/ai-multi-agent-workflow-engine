<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Workflow diagram: a request flows from the Router to domain agents, through MCP tools, pauses at the human-in-the-loop gate, and reaches a result">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="2" y="2" width="1196" height="466" rx="20" fill="#0a0f1e" stroke="#1e293b"/>

  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="700" fill="#e8ecf4">How a request flows through the engine</text>
  <text x="600" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#8b98ad">One request in. One verified result out. A human steps in only when money is involved.</text>

  <!-- connectors -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path id="c1" d="M 190 225 H 222" marker-end="url(#arrow)"/>
    <path id="c2" d="M 376 225 H 408" marker-end="url(#arrow)"/>
    <path id="c3" d="M 602 225 H 634" marker-end="url(#arrow)"/>
    <path id="c4" d="M 788 225 H 820" marker-end="url(#arrow)"/>
    <path id="c5" d="M 974 225 H 1006" marker-end="url(#arrow)"/>
  </g>
  <!-- flowing dots -->
  <g fill="#22d3ee">
    <circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"><mpath href="#c2"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#c3"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#c4"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#c5"/></animateMotion></circle>
  </g>

  <!-- nodes -->
  <g font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">
    <!-- Request -->
    <rect x="40" y="185" width="150" height="80" rx="14" fill="#141b2e" stroke="#2a3550" stroke-width="1.5"/>
    <text x="115" y="218" font-size="17" font-weight="700" fill="#e8ecf4">Request</text>
    <text x="115" y="242" font-size="12.5" fill="#8b98ad">a business question</text>

    <!-- Router -->
    <rect x="226" y="185" width="150" height="80" rx="14" fill="#141b2e" stroke="#7c5cff" stroke-width="2"/>
    <text x="301" y="218" font-size="17" font-weight="700" fill="#e8ecf4">Router</text>
    <text x="301" y="242" font-size="12.5" fill="#8b98ad">classifies intent</text>

    <!-- Domain agents -->
    <rect x="412" y="185" width="190" height="80" rx="14" fill="#141b2e" stroke="#38bdf8" stroke-width="2"/>
    <text x="507" y="212" font-size="17" font-weight="700" fill="#e8ecf4">Domain Agents</text>
    <text x="507" y="236" font-size="12.5" fill="#8b98ad">Invoice · Report</text>
    <text x="507" y="254" font-size="12.5" fill="#8b98ad">Lookup · Policy</text>

    <!-- MCP Tools -->
    <rect x="638" y="185" width="150" height="80" rx="14" fill="#141b2e" stroke="#22d3ee" stroke-width="2"/>
    <text x="713" y="218" font-size="17" font-weight="700" fill="#e8ecf4">MCP Tools</text>
    <text x="713" y="240" font-size="12.5" fill="#8b98ad">lookup · validate</text>
    <text x="713" y="257" font-size="12.5" fill="#8b98ad">search · draft</text>

    <!-- HITL Gate -->
    <rect x="824" y="185" width="150" height="80" rx="14" fill="#1c1408" stroke="#f59e0b" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="899" y="218" font-size="17" font-weight="700" fill="#fbbf24">HITL Gate</text>
    <text x="899" y="242" font-size="12.5" fill="#d9a441">human approves</text>
    <text x="899" y="258" font-size="12.5" fill="#d9a441">money moves</text>

    <!-- Result -->
    <rect x="1010" y="185" width="150" height="80" rx="14" fill="#0d2318" stroke="#34d399" stroke-width="2"/>
    <text x="1085" y="218" font-size="17" font-weight="700" fill="#6ee7b7">Result</text>
    <text x="1085" y="242" font-size="12.5" fill="#8b98ad">citations + trace</text>
  </g>

  <!-- human loop: HITL gate -> human -> result -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="6 5">
    <path id="h1" d="M 899 265 V 330" marker-end="url(#arrowAmber)"/>
    <path id="h2" d="M 1004 355 C 1014 355 1030 340 1045 320 C 1058 303 1072 285 1085 268" marker-end="url(#arrowAmber)"/>
  </g>
  <g fill="#fbbf24">
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#h1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#h2"/></animateMotion></circle>
  </g>
  <rect x="794" y="330" width="210" height="48" rx="24" fill="#141b2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="899" y="359" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#fbbf24">👤 Human approves / rejects</text>

  <!-- footer notes -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#8b98ad">
    <text x="60" y="425">✓ Every tool call goes through the MCP server — agents never touch data directly.</text>
    <text x="60" y="449">✓ If a step fails mid-way, the saga reverses the steps already done. Nothing is left half-applied.</text>
  </g>
</svg>
